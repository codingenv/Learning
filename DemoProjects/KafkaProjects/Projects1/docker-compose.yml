# Minimal single-broker Kafka cluster (KRaft mode — no ZooKeeper needed)
# Run:   docker compose up -d
# Stop:  docker compose down

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka-demo
    ports:
      - "9092:9092"   # EXTERNAL — your Java apps connect here (localhost:9092)
    environment:
      # KRaft: this node is both broker and controller
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # INTERNAL  → container-to-container (kafka-ui talks to kafka on this)
      # EXTERNAL  → Windows host talks to kafka on localhost:9092
      # CONTROLLER → internal KRaft consensus traffic
      KAFKA_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Topic defaults
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24

    # No healthcheck — kafka-ui starts after a fixed delay instead (see below)
    # The apache/kafka image starts in ~5s; 15s delay is plenty.

  # Kafka UI — visual dashboard at http://localhost:8080
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka          # simple dependency, no healthcheck required
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      # kafka-ui will retry the connection on its own if Kafka isn't ready yet
